[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pith-h264"
version = "0.1.0"
description = "H.264/AVC baseline-subset decoding SDK: Annex-B NAL/SPS/PPS, CAVLC slices, in-loop deblocking via the pith-h264 Rust cdylib (ctypes, zero-dep)"
license = "MIT"
requires-python = ">=3.9"
keywords = ["h264", "avc", "video", "decoder", "hashing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Repository = "https://github.com/pith-hash/pith-h264"
Homepage = "https://github.com/pith-hash/pith-h264"

[tool.setuptools]
packages = ["pith_h264"]

[tool.setuptools.package-data]
pith_h264 = ["*.dll", "*.dylib", "*.so"]
